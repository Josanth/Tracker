# Render Blueprint: one free web service serving the API and the built React app.
# Deploy: Render dashboard → New → Blueprint → pick this repository.
services:
  - type: web
    name: project-tracker
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && npm install --prefix client --include=dev && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      # Render's free disk is wiped on every restart, so data lives in a free hosted Turso database.
      # Enter both values in the Render dashboard (they are secrets, so they are not stored here).
      # Without them the app falls back to a local file and loses data on restart.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Load the demo accounts only when the database is brand new and empty.
      - key: SEED_DEMO
        value: "true"
      # No email service is configured, so show the password-reset link on the page for the demo.
      - key: SHOW_RESET_LINK
        value: "true"
